[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kit-host-tensor"
version = "0.1.0"
description = "host-tensor backend for mlopt: mlopt_core.ports.Sink over the handl-lang/host-tensor f64 tensor.* op surface via its PyO3 binding. Split from handl-lang/graphopt packages/mlopt-host-tensor (P3 Step D-1f)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mlopt-core",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "ty==0.0.84",
    "import-linter>=2.15",
]

# Substrate pins for local dev — consumers that git-pin `kit-host-tensor`
# resolve `mlopt-*` through their own `[tool.uv.sources]` (uv honours
# sources only at the workspace root).
[tool.uv.sources]
mlopt-core = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-core", tag = "v0.1.14" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kit_host_tensor = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 72

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = [
    "E501",     # line length — math/notation lines exceed 72 legitimately
    "B008",     # function-call in default arg — used for cost-fn defaults
    "SIM108",   # ternary suggestion — if/else often clearer here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

# --- typecheck (ty) -----------------------------------------------
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src"]
exclude = []

[tool.ty.terminal]
error-on-warning = false

[tool.coverage.run]
source = ["kit_host_tensor"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
# Phase-1 measurement (P3 Step D-1f): 32% total branch coverage on
# the carved suite *without* the PyO3 extension or host-tensor
# checkout (the CI condition — extension/surface tests skip); 69%
# on a dev host with the sibling `../host-tensor` build present.
# The floor is the CI number so `ci.sh` holds everywhere; graphopt's
# suite exercises the executor paths through the git dep.  Ratchet
# convention: tighten, never lower.
fail_under = 32
show_missing = true
exclude_also = [
    "if __name__ == ['\"]__main__['\"]:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "raise NotImplementedError",
    "@overload",
    "return NotImplemented",
]

# import-linter: kit_host_tensor is a leaf backend — it binds
# mlopt_core + numpy only.  The `handl_host_tensor` PyO3 extension is
# an *undeclared runtime* resolved by env/sibling path, never a pip
# dep.  Every sibling kit, the game layer, the product, and the old
# spellings are forbidden outright (both mlopt_* and kit_* names are
# listed during the transition).
[tool.importlinter]
root_packages = ["kit_host_tensor"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "kit_host_tensor is a leaf backend — mlopt_core + numpy only"
type = "forbidden"
source_modules = ["kit_host_tensor"]
forbidden_modules = [
    "mlopt_torch",
    "kit_torch",
    "mlopt_onnx",
    "kit_onnx",
    "mlopt_cuda",
    "kit_cuda",
    "mlopt_carriers",
    "kit_carriers",
    "mlopt_discovery",
    "kit_discovery",
    "mlopt_orchestrator",
    "gamekit",
    "benchkit",
    "discoverykit",
    "mlopt",
    "mlopt_host_tensor",
]
